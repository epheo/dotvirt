# operator-sdk, opm and kind at the versions and sha256 digests pinned in
# hack/versions.env. Release binaries, not `go run`: compiling opm from source takes
# over a minute. They run in jobs that push to quay, so a cache hit is verified too:
# a cache entry is only as trustworthy as the job that saved it.
name: operator-tools
description: operator-sdk, opm and kind release binaries, pinned and verified from hack/versions.env
runs:
  using: composite
  steps:
    - name: Load pinned tool versions
      shell: bash
      run: |
        grep -v '^#' hack/versions.env >> "$GITHUB_ENV"
        echo "$HOME/.cache/dotvirt-tools" >> "$GITHUB_PATH"
    - name: Restore tool binaries
      id: tools
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/dotvirt-tools
        key: dotvirt-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/versions.env') }}
    - name: Download tool binaries (cache miss)
      if: steps.tools.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/.cache/dotvirt-tools && cd ~/.cache/dotvirt-tools
        curl -fsSL -o operator-sdk "https://github.com/operator-framework/operator-sdk/releases/download/$OPERATOR_SDK_VERSION/operator-sdk_linux_amd64"
        curl -fsSL -o opm "https://github.com/operator-framework/operator-registry/releases/download/$OPM_VERSION/linux-amd64-opm"
        curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
    - name: Verify tool binaries
      shell: bash
      # --strict: an empty digest is a malformed line, which plain -c skips and passes.
      run: |
        cd ~/.cache/dotvirt-tools
        printf '%s  %s\n' "$OPERATOR_SDK_SHA256" operator-sdk "$OPM_SHA256" opm "$KIND_SHA256" kind |
          sha256sum --check --strict
        chmod +x operator-sdk opm kind
    # Saved right after verification, so a job that fails later still spares the next run the download.
    - name: Save tool binaries (cache miss)
      if: steps.tools.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/dotvirt-tools
        key: ${{ steps.tools.outputs.cache-primary-key }}
