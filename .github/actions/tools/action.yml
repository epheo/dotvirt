# Release downloads at the versions and sha256 digests pinned in hack/versions.env.
# Release binaries, not `go run`: compiling opm from source takes over a minute.
# Some run in jobs that push to quay, so a cache hit is verified too: a cache entry is
# only as trustworthy as the job that saved it. Only verified files leave the cache
# dir, so nothing else it holds ever reaches PATH.
name: tools
description: Pinned, sha256-verified and cached CI tools from hack/versions.env
inputs:
  tools:
    description: >-
      Space-separated: operator-sdk, opm, kind, golangci-lint (onto PATH), olm
      ($RUNNER_TEMP/tools/olm/{crds,olm}.yaml), envtest ($RUNNER_TEMP/tools/envtest)
    required: true
runs:
  using: composite
  steps:
    - name: Load pinned tool versions
      id: load
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        grep -v '^#' hack/versions.env >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
        read -ra names <<<"$TOOLS"
        echo "key=dotvirt-tools-$RUNNER_OS-$RUNNER_ARCH-$(IFS=-; echo "${names[*]}")-${{ hashFiles('hack/versions.env') }}" >> "$GITHUB_OUTPUT"
    - name: Restore tool downloads
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/dotvirt-tools
        key: ${{ steps.load.outputs.key }}
    - name: Verify and install tools
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      # --strict: an empty digest is a malformed line, which plain -c skips and passes.
      run: |
        out="$RUNNER_TEMP/tools"
        mkdir -p ~/.cache/dotvirt-tools "$out/bin" && cd ~/.cache/dotvirt-tools
        rel=https://github.com
        get() { # <file> <sha256> <url>
          [ -f "$1" ] || curl -fsSL -o "$1" "$3"
          echo "$2  $1" | sha256sum --check --strict
        }
        for t in $TOOLS; do
          case "$t" in
          operator-sdk)
            get operator-sdk "$OPERATOR_SDK_SHA256" "$rel/operator-framework/operator-sdk/releases/download/$OPERATOR_SDK_VERSION/operator-sdk_linux_amd64"
            install -m 0755 operator-sdk "$out/bin/" ;;
          opm)
            get opm "$OPM_SHA256" "$rel/operator-framework/operator-registry/releases/download/$OPM_VERSION/linux-amd64-opm"
            install -m 0755 opm "$out/bin/" ;;
          kind)
            get kind "$KIND_SHA256" "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
            install -m 0755 kind "$out/bin/" ;;
          golangci-lint)
            v="${GOLANGCI_LINT_VERSION#v}"
            get golangci-lint.tar.gz "$GOLANGCI_LINT_SHA256" "$rel/golangci/golangci-lint/releases/download/$GOLANGCI_LINT_VERSION/golangci-lint-$v-linux-amd64.tar.gz"
            tar -xzf golangci-lint.tar.gz -C "$out/bin" --strip-components=1 "golangci-lint-$v-linux-amd64/golangci-lint" ;;
          olm)
            u="$rel/operator-framework/operator-lifecycle-manager/releases/download/v$OLM_VERSION"
            get olm-crds.yaml "$OLM_CRDS_SHA256" "$u/crds.yaml"
            get olm.yaml "$OLM_SHA256" "$u/olm.yaml"
            mkdir -p "$out/olm" && cp olm-crds.yaml "$out/olm/crds.yaml" && cp olm.yaml "$out/olm/olm.yaml" ;;
          envtest)
            get envtest.tar.gz "$ENVTEST_SHA256" "$rel/kubernetes-sigs/controller-tools/releases/download/envtest-v$ENVTEST_K8S_VERSION/envtest-v$ENVTEST_K8S_VERSION-linux-amd64.tar.gz"
            mkdir -p "$out/envtest" && tar -xzf envtest.tar.gz -C "$out/envtest" --strip-components=2 ;;
          *) echo "::error::unknown tool: $t"; exit 1 ;;
          esac
        done
    # Saved right after verification, so a job that fails later still spares the next run the download.
    - name: Save tool downloads (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/dotvirt-tools
        key: ${{ steps.load.outputs.key }}
