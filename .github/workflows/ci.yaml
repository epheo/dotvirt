# GitHub Actions CI. The `image` job runs in the `QUAY` environment, which holds the
# secrets QUAY_USERNAME / QUAY_PASSWORD (push credentials for quay.io/epheo).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# No GOTOOLCHAIN here: setup-go installs go.mod's version and exports
# GOTOOLCHAIN=local, which overrides workflow env.
env:
  IMAGE: quay.io/epheo/dotvirt
  GOPROXY: https://proxy.golang.org|direct # '|' falls back on any proxy error, not only 404/410
  GOFLAGS: -buildvcs=false

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            operator/go.sum
      # ./... stops at nested modules, so the pkg modules and the operator are named.
      # go vet runs in lint, as golangci-lint's govet.
      - run: go test ./... ./pkg/forge/... ./pkg/tenancy/... ./operator/...
      - uses: ./.github/actions/tools
        with:
          tools: envtest
      - name: Operator envtest (server-side apply + RBAC on a real apiserver)
        run: make -C operator test-envtest ENVTEST_ASSETS="$RUNNER_TEMP/tools/envtest"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/tools
        with:
          tools: golangci-lint
      # Every module shares .golangci.yml (resolved by walking up). install-mode none:
      # the action's own download is unverified, so it runs the binary verified above.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          working-directory: operator
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          working-directory: pkg/forge
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          working-directory: pkg/tenancy

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run test:unit
        working-directory: web
      # No `npm run build`: ui builds the SPA (test:ui), and image-build again in the image.

  # The hermetic UI suite: the built SPA against the scripted fixture backend
  # (web/e2e/fixture) — no cluster, no forge. Holds the app in the corner-case
  # states a live cluster never shows on demand (standing sync failures,
  # degraded planes, 300-VM fleets, WS drops) and gates on behavior, console
  # errors, and axe. Screenshots of every key view upload as an artifact for a
  # human pass.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:ui
        working-directory: web
      - name: Upload view screenshots (human-reviewable)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: web/e2e/screenshots/
          if-no-files-found: ignore
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  # Merge gate: generated files in sync + the OLM artifacts valid, so a stale generated
  # manifest/model/bundle or an invalid CSV/catalog fails the PR instead of main. Uses
  # no secrets, so it also runs on fork PRs.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Its own cache entry, keyed on what the `go run` tools below depend on, so
          # their builds are restored instead of compiled each run.
          cache-dependency-path: |
            go.sum
            operator/go.sum
            operator/Makefile
            hack/versions.env
      - uses: ./.github/actions/tools
        with:
          tools: operator-sdk opm
      - name: Catalog image's opm matches OPM_VERSION
        run: |
          grep -q "^FROM quay.io/operator-framework/opm:$OPM_VERSION@sha256:" operator/catalog.Dockerfile \
            || { echo "::error::operator/catalog.Dockerfile must pin opm:$OPM_VERSION (hack/versions.env) by digest"; exit 1; }
      - name: Scorecard config pins SCORECARD_TEST_IMAGE
        # bundle-test preloads exactly that image; any other ref would be pulled mid-test.
        run: |
          other="$(grep -rh 'image: ' operator/config/scorecard/patches | grep -vF "image: $SCORECARD_TEST_IMAGE" || true)"
          [ -z "$other" ] || { echo "::error::operator/config/scorecard must use $SCORECARD_TEST_IMAGE (hack/versions.env)"; exit 1; }
      - name: Generated manifests in sync
        run: |
          make -C operator manifests generate
          git diff --exit-code -- operator/api operator/config/crd operator/config/rbac \
            || { echo "::error::stale generated manifests — run 'make -C operator manifests generate' and commit"; exit 1; }
      - name: Generated TS model in sync
        run: |
          go run "github.com/gzuidhof/tygo@$TYGO_VERSION" generate
          git diff --exit-code -- web/src/lib/model.gen.ts \
            || { echo "::error::stale web/src/lib/model.gen.ts — run 'make types' and commit"; exit 1; }
      - name: Validate bundle + catalog
        # The default-categories validate runs inside `make bundle` below.
        run: |
          # OperatorHub.io parity: their pipeline validates categories against the repo's
          # own categories.json, which drifts from operator-framework/api's built-in list.
          # Pinned to the upstream commit that last changed it, so a red here is this diff's.
          curl -fsSL -o /tmp/categories.json \
            https://raw.githubusercontent.com/k8s-operatorhub/community-operators/60e9ab2665da20563f8bd5cc91668a4248f2334d/categories.json
          OPERATOR_BUNDLE_CATEGORIES=/tmp/categories.json \
            operator-sdk bundle validate ./operator/bundle --select-optional suite=operatorframework
          opm validate operator/catalog
      - name: Committed bundle in sync
        # operator/bundle is generated from operator/config by `make bundle`, and nothing
        # else keeps them in sync — regenerate at the committed CSV's version and fail on
        # drift. createdAt is a generation timestamp, not content, so it's ignored (the
        # community-operators pipelines do the same). Uses the operator-sdk installed above.
        run: |
          VERSION="$(go run "github.com/mikefarah/yq/v4@$YQ_VERSION" '.spec.version' operator/bundle/manifests/dotvirt-operator.clusterserviceversion.yaml)"
          make -C operator bundle VERSION="$VERSION"
          git add -N operator # so newly generated files show in the diff
          git diff --exit-code -I'^    createdAt:' -- operator \
            || { echo "::error::stale bundle — run 'make -C operator bundle VERSION=$VERSION' and commit"; exit 1; }

  # Install the bundle on a throwaway kind cluster via OLM (à la community-operators
  # CI) + run scorecard, so a bundle that won't install fails the PR. The committed
  # bundle is pointed at THIS build's operator image (served from the kind-local
  # registry), so the job gates the diff; whether the published quay digests still
  # install is verify-published-bundle.yaml's subject, never a PR's. Everything else
  # the install path pulls is preloaded by olm-kind, so a red here means the bundle
  # broke — not that a registry hiccuped. No secrets, so it runs on fork PRs too.
  bundle-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/olm-kind
        with:
          tools: operator-sdk opm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          # Host network reaches the kind-local registry on 127.0.0.1:5000. use: false
          # keeps the plain `docker build`s below on the daemon, where `docker push` looks.
          driver-opts: |
            network=host
            image=${{ env.BUILDKIT_IMAGE }}
          use: false
      - name: Build the operator image from this tree
        # Reads the layer cache image-build writes on main, so a PR that leaves the
        # operator and the pkg modules alone skips the compile.
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          source: .
          targets: operator
          push: true
          set: |
            operator.platform=linux/amd64
            operator.tags=localhost:5000/dotvirt-operator:ci
            operator.cache-from=type=gha,scope=operator
      - name: Point the bundle at the freshly built image
        # Swap only the manager image ref; the bundle otherwise stays exactly what
        # validate proves in sync with operator/config. A sed that matches nothing would
        # install the published operator and pass without testing this tree.
        run: |
          csv=operator/bundle/manifests/dotvirt-operator.clusterserviceversion.yaml
          sed -i -E 's#quay\.io/epheo/dotvirt-operator@sha256:[0-9a-f]+#localhost:5000/dotvirt-operator:ci#g' "$csv"
          grep -q 'localhost:5000/dotvirt-operator:ci' "$csv" \
            || { echo "::error::no quay.io/epheo/dotvirt-operator@sha256 ref in $csv to repoint"; exit 1; }
      - name: Build + push the bundle to the local registry
        run: make -C operator bundle-build bundle-push BUNDLE_IMG=localhost:5000/dotvirt-operator-bundle:ci CONTAINER_TOOL=docker
      - name: Render + push a CI catalog serving that bundle
        # The same install mechanism as production and the canary (a catalog image,
        # opm pinned by digest in catalog.Dockerfile, behind a CatalogSource), not
        # operator-sdk's ephemeral `run bundle` registry pod, whose unpinned
        # opm:latest/ubi machinery is a recurring flake source.
        run: |
          CSV_NAME="$(awk '/^  name: dotvirt-operator\.v/{print $2; exit}' operator/bundle/manifests/dotvirt-operator.clusterserviceversion.yaml)"
          echo "CSV_NAME=$CSV_NAME" >> "$GITHUB_ENV"
          cat > /tmp/ci-catalog-template.yaml <<EOF
          schema: olm.template.basic
          entries:
            - schema: olm.package
              name: dotvirt-operator
              defaultChannel: stable-v0
            - schema: olm.channel
              package: dotvirt-operator
              name: stable-v0
              entries:
                - name: $CSV_NAME
            - schema: olm.bundle
              image: localhost:5000/dotvirt-operator-bundle:ci
          EOF
          opm alpha render-template basic --use-http -o yaml /tmp/ci-catalog-template.yaml \
            > operator/catalog/dotvirt-operator/catalog.yaml
          opm validate operator/catalog
          docker build -f operator/catalog.Dockerfile -t localhost:5000/dotvirt-operator-catalog:ci operator
          docker push localhost:5000/dotvirt-operator-catalog:ci
      - name: Install via OLM from the CI catalog (assert the CSV reaches Succeeded)
        run: |
          kubectl create namespace dotvirt-ci
          cat <<EOF | kubectl apply -f -
          apiVersion: operators.coreos.com/v1alpha1
          kind: CatalogSource
          metadata:
            name: dotvirt-catalog-ci
            namespace: dotvirt-ci
          spec:
            sourceType: grpc
            image: localhost:5000/dotvirt-operator-catalog:ci
          ---
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: dotvirt-ci
            namespace: dotvirt-ci
          spec: {}
          ---
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: dotvirt-operator
            namespace: dotvirt-ci
          spec:
            channel: stable-v0
            name: dotvirt-operator
            source: dotvirt-catalog-ci
            sourceNamespace: dotvirt-ci
          EOF
          ./hack/wait-csv.sh dotvirt-ci dotvirt-operator "$CSV_NAME"
      - name: Scorecard (basic + olm)
        run: operator-sdk scorecard ./operator/bundle --wait-time 180s

  # Both images at both release arches (docker-bake.hcl), so a broken Containerfile,
  # Dockerfile or arm64 cross-compile fails the PR, not the release. Layers cache per
  # image in GitHub Actions; main's run writes the scope PRs read. No push and no
  # secrets, so it runs on fork PRs too.
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: grep -v '^#' hack/versions.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build (no push)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          set: |
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,scope=app,mode=max,ignore-error=true
            operator.cache-from=type=gha,scope=operator
            operator.cache-to=type=gha,scope=operator,mode=max,ignore-error=true

  # App image push, main only: deploy/operator pin the immutable digest of the
  # short-sha tag this publishes. After image-build, so every layer is a cache hit.
  image:
    if: github.ref == 'refs/heads/main'
    needs: [go, web, image-build]
    runs-on: ubuntu-latest
    environment: QUAY # GitHub Actions environment holding the QUAY_* push secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - run: grep -v '^#' hack/versions.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build & push (multi-arch)
        # Push the immutable per-commit SHA tag only, never a moving :latest (a moving tag
        # orphans the digests that DefaultImage/relatedImages pin to). Multi-arch so arm64
        # nodes (e.g. hetznet) can run the per-commit image.
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: app
          push: true
          set: |
            app.tags=${{ env.IMAGE }}:${{ env.TAG }}
            app.cache-from=type=gha,scope=app
