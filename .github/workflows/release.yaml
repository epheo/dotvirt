# Cut a digest-pinned OLM release. Runs hack/release.sh (build + push app, operator,
# bundle, catalog to quay.io/epheo, each pinned by immutable @sha256 digest), then opens
# a PR recording the digest pins. Branch protection means the pins land via that PR, not
# the tagged commit — the tag marks intent, the merged PR is the record.
#
# Triggered two ways: push a `v*` tag (VERSION from the tag, PREV = the current
# stable-v0-channel head in operator/catalog-template.yaml — no manual input, so it can't
# drift), or workflow_dispatch for re-runs / overrides with an explicit version + prev.
# Any re-run reuses the :vVERSION images already pushed, so the digests an earlier run
# pinned survive; it then updates that run's pin branch and draft Release in place.
# Runs in the `QUAY` environment (QUAY_USERNAME / QUAY_PASSWORD push secrets).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, x.y.z"
        required: true
      prev:
        description: "Version this release replaces, x.y.z"
        required: true
      force:
        description: "Rebuild images already pushed for this version (moves their tags; quay prunes the old digests)"
        type: boolean
        default: false

env:
  GOPROXY: https://proxy.golang.org|direct # '|' falls back on any proxy error, not only 404/410

jobs:
  release:
    runs-on: ubuntu-latest
    environment: QUAY
    permissions:
      contents: write
      pull-requests: write
    outputs:
      catalog-image: ${{ steps.pins.outputs.catalog-image }}
      version: ${{ steps.pins.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Resolve version + prev
        run: |
          source hack/lib.sh   # current_stable_head + repo-root cd
          if [ "${{ github.event_name }}" = push ]; then
            ver="${GITHUB_REF_NAME#v}"             # tag v1.2.3 -> 1.2.3
            prev="$(current_stable_head || true)"  # what it replaces — the stable-v0 head recorded in git
          else
            ver="${{ inputs.version }}"; prev="${{ inputs.prev }}"
          fi
          [ -n "$ver" ] && [ -n "$prev" ] || { echo "::error::could not resolve version/prev (ref=$GITHUB_REF_NAME)"; exit 1; }
          { echo "REL_VERSION=$ver"; echo "REL_PREV=$prev"; } >> "$GITHUB_ENV"
          # A tag whose commit already records this version's pins is a locally-cut
          # release (hack/release.sh ran outside CI). Rebuilding would race the same
          # quay tags onto different digests — the moved-tag/pruned-digest failure
          # mode — so skip the build and let verify prove the published images instead.
          if [ "${{ github.event_name }}" = push ] && [ "$(current_stable_head)" = "$ver" ]; then
            echo "::notice::v$ver is already digest-pinned at this commit — skipping the build; verifying the published release"
            echo "REL_SKIP=true" >> "$GITHUB_ENV"
          fi
          echo "Releasing v$ver (replaces v$prev)"
      - uses: ./.github/actions/operator-tools # skopeo ships on the runner image
        if: env.REL_SKIP != 'true'
      - name: Registry login (docker + skopeo)
        if: env.REL_SKIP != 'true'
        env:
          U: ${{ secrets.QUAY_USERNAME }}
          P: ${{ secrets.QUAY_PASSWORD }}
        run: |
          echo "$P" | docker login quay.io -u "$U" --password-stdin
          echo "$P" | skopeo login quay.io -u "$U" --password-stdin
      # Emulation for the catalog image's arm64 cache-build RUN.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: env.REL_SKIP != 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.REL_SKIP != 'true'
      - name: Cut release (build + push + digest-pin)
        if: env.REL_SKIP != 'true'
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          OPM: opm # the operator-tools binary; the scripts' default compiles opm from source
        run: VERSION="$REL_VERSION" PREV="$REL_PREV" CONTAINER_TOOL=docker ./hack/release.sh
      - name: Record the pinned catalog image
        id: pins
        run: |
          { echo "catalog-image=$(sed -n 's/^  image: //p' operator/install/catalogsource.yaml)"
            echo "version=$REL_VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: Open digest-pin PR
        if: env.REL_SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "dotvirt-release[bot]"
          git config user.email "dotvirt-release[bot]@users.noreply.github.com"
          branch="release-v$REL_VERSION"
          git switch -c "$branch"
          git commit -am "release v$REL_VERSION: digest-pinned (replaces v$REL_PREV)"
          # A re-run replaces the earlier run's pin commit. The lease names the tip it
          # replaces (empty: the branch must not exist): a bare --force-with-lease reads
          # a tracking ref this tag checkout never fetched, and rejects every re-run.
          lease="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          git push --force-with-lease="refs/heads/$branch:$lease" -u origin "$branch"
          open="$(gh pr list --head "$branch" --json number --jq length || echo 0)"
          [ "$open" = 0 ] || exit 0
          # PR creation needs the repo setting "Allow GitHub Actions to create and
          # approve pull requests". Without it the branch is still pushed and the
          # images are already on quay — failing here would only skip verify, so
          # warn and leave the PR to be opened by hand.
          gh pr create --base main --head "$branch" \
            --title "release v$REL_VERSION" \
            --body "Digest-pinned release cut by CI; images already pushed to quay.io/epheo. Merge to record the pins, then apply operator/install/catalogsource.yaml." \
            || echo "::warning::could not open the pin PR — open it manually: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
      - name: Draft the GitHub Release
        # A draft: upgrade notes (manual steps, breaking changes) need a human before
        # it is published; the generated part lists the PRs since the previous tag.
        if: env.REL_SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$REL_VERSION" >/dev/null 2>&1; then
            # The asset must pin this run's catalog, which a forced re-run or a changed prev moved.
            gh release upload "v$REL_VERSION" operator/install/catalogsource.yaml --clobber
            exit 0
          fi
          gh release create "v$REL_VERSION" --draft --verify-tag \
            --title "v$REL_VERSION" \
            --generate-notes --notes-start-tag "v$REL_PREV" \
            operator/install/catalogsource.yaml

  # Prove the just-pushed release actually installs from quay before anyone merges the
  # pin PR — the same install the daily canary runs, pointed at the fresh catalog digest.
  verify:
    needs: [release]
    uses: ./.github/workflows/verify-published-bundle.yaml
    with:
      catalog-image: ${{ needs.release.outputs.catalog-image }}
      expected-csv: dotvirt-operator.v${{ needs.release.outputs.version }}
