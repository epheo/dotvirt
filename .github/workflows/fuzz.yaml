# Nightly fuzzing. PR CI runs each fuzz target's committed corpus
# deterministically (plain `go test`); the open-ended search runs here so a
# random discovery files as a red nightly with a reproducer, never a flaky PR.
# A failing input is printed base64-encoded in the log — commit it under
# testdata/fuzz/<target>/ to make it a permanent regression seed.
name: fuzz

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

env:
  GOPROXY: https://proxy.golang.org|direct # '|' falls back on any proxy error, not only 404/410

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz the manifest line editor
        run: go test -fuzz FuzzApplyEdit -fuzztime 10m ./internal/manifest/
        env: { GOFLAGS: -buildvcs=false }
      - name: Surface any new crasher
        if: failure()
        run: |
          for f in internal/manifest/testdata/fuzz/*/*; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
