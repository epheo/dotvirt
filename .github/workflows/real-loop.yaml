# The real-loop tier: nightly proof that the PUBLISHED dotvirt images drive the
# actual product loop on the actual target platform, and that this tree installs
# without KubeVirt. hack/e2e-microshift.sh
# boots ghcr.io/epheo/microshift as a privileged container, installs ArgoCD +
# KubeVirt (emulation) + the digest-pinned dotvirt operator, creates a tenant
# project through dotvirt's own API, and runs the stage -> PR -> merge -> Argo
# sync -> delete round-trip, failing on any stalled hop.
#
# Nightly (not a PR gate): a ~25-minute multi-system job whose failures are
# environmental as often as regressions — a red here is a morning
# investigation with full diagnostics attached, never PR flake.
name: real-loop

on:
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch:
  # Path-scoped PR trigger: the loop's own harness is the one thing PRs can
  # break that only this job would notice — normal PRs never pay for it.
  pull_request:
    paths:
      - '.github/workflows/real-loop.yaml'
      - 'hack/e2e-microshift.sh'
      - 'hack/e2e-roundtrip.sh'

permissions:
  contents: read

jobs:
  microshift-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk (the bootc image embeds its payload)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h / | tail -1
      - name: Host prerequisites
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y lvm2 thin-provisioning-tools podman
          sudo modprobe openvswitch
      - name: Run the round-trip on MicroShift
        run: sudo -E WORKDIR="$RUNNER_TEMP/e2e" hack/e2e-microshift.sh
      - name: Collect the run log
        if: always()
        run: |
          mkdir -p artifacts
          cp -r "$RUNNER_TEMP/e2e" artifacts/ 2>/dev/null || true
          sudo podman logs dotvirt-e2e-microshift > artifacts/microshift-container.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-loop-diagnostics
          path: artifacts/
          if-no-files-found: ignore

  # The other shape dotvirt installs on: no KubeVirt, served through a portail
  # Gateway. Built from this tree, since the proof must not wait for a release.
  microshift-no-kubevirt:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk (the bootc image embeds its payload)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h / | tail -1
      - run: grep -v '^#' hack/versions.env >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build both images from this tree
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          docker buildx bake \
            --allow "fs.write=$RUNNER_TEMP/images" \
            --set '*.platform=linux/amd64' \
            --set app.tags=localhost/dotvirt:e2e \
            --set "app.output=type=docker,dest=$RUNNER_TEMP/images/app.tar" \
            --set operator.tags=localhost/dotvirt-operator:e2e \
            --set "operator.output=type=docker,dest=$RUNNER_TEMP/images/operator.tar"
      - name: Host prerequisites
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y lvm2 thin-provisioning-tools podman
          sudo modprobe openvswitch
      - name: Install without KubeVirt on MicroShift
        run: |
          sudo -E WORKDIR="$RUNNER_TEMP/e2e" KUBEVIRT=0 \
            APP_IMAGE_TAR="$RUNNER_TEMP/images/app.tar" \
            OPERATOR_IMAGE_TAR="$RUNNER_TEMP/images/operator.tar" \
            hack/e2e-microshift.sh
      - name: Collect the run log
        if: always()
        run: |
          mkdir -p artifacts
          cp -r "$RUNNER_TEMP/e2e" artifacts/ 2>/dev/null || true
          sudo podman logs dotvirt-e2e-microshift > artifacts/microshift-container.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: real-loop-no-kubevirt-diagnostics
          path: artifacts/
          if-no-files-found: ignore
