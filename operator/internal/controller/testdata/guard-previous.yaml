      || c.env.all(e, e.name != "DOTVIRT_METRICS_URL" || (!has(e.valueFrom) && (has(e.value)
      ? e.value : "") in ["${METRICS_URL}"]))) && (!has(c.args) || c.args.all(a, !(a
      == "-metrics-tenancy-url" || a == "--metrics-tenancy-url" || a.startsWith("-metrics-tenancy-url=")
      || a.startsWith("--metrics-tenancy-url=")) || a in ["-metrics-tenancy-url=${METRICS_TENANCY_URL}",
      "--metrics-tenancy-url=${METRICS_TENANCY_URL}"])) && (!has(c.env) || c.env.all(e,
      e.name != "DOTVIRT_METRICS_TENANCY_URL" || (!has(e.valueFrom) && (has(e.value)
