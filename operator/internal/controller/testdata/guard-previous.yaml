      ? m.mountPath : m.mountPath + "/") && !m.mountPath.startsWith("/var/run/secrets/kubernetes.io/serviceaccount/")
      && !"/run/secrets/kubernetes.io/serviceaccount/".startsWith(m.mountPath.endsWith("/")
      ? m.mountPath : m.mountPath + "/") && !m.mountPath.startsWith("/run/secrets/kubernetes.io/serviceaccount/")
      && !m.mountPath.contains("//") && !m.mountPath.contains("/./") && !m.mountPath.contains("/../")
