    reason: Forbidden
  - expression: 'object.metadata.name == "dotvirt" ? object.spec.template.spec.serviceAccountName
      == "dotvirt" : (object.metadata.name == "dotvirt-forgejo" && object.spec.template.spec.serviceAccountName
      == "dotvirt-forgejo")'
    message: the operator runs only the console as dotvirt and the forge as dotvirt-forgejo
      (dotvirt operator guard)
    reason: Forbidden
  - expression: 'object.metadata.name == "dotvirt" ? (object.spec.template.spec.containers.all(c,
      (c.image.startsWith("quay.io/epheo/dotvirt@sha256:") || c.image.startsWith("quay.io/epheo/dotvirt:")
      || c.image in ["${SPEC_IMAGE}", "${RELATED_IMAGE_DOTVIRT}"])) && (!has(object.spec.template.spec.initContainers)
      || object.spec.template.spec.initContainers.all(c, (c.image.startsWith("quay.io/epheo/dotvirt@sha256:")
      || c.image.startsWith("quay.io/epheo/dotvirt:") || c.image in ["${SPEC_IMAGE}",
      "${RELATED_IMAGE_DOTVIRT}"])))) : (object.spec.template.spec.containers.all(c,
      (c.image.startsWith("codeberg.org/forgejo/forgejo@sha256:") || c.image.startsWith("codeberg.org/forgejo/forgejo:")
      || c.image in ["${RELATED_IMAGE_FORGEJO}"])) && (!has(object.spec.template.spec.initContainers)
      || object.spec.template.spec.initContainers.all(c, (c.image.startsWith("codeberg.org/forgejo/forgejo@sha256:")
      || c.image.startsWith("codeberg.org/forgejo/forgejo:") || c.image in ["${RELATED_IMAGE_FORGEJO}"]))))'
    message: the operator runs the console only from quay.io/epheo/dotvirt and the
      forge only from codeberg.org/forgejo/forgejo, or the image an admin chose (dotvirt
      operator guard)
    reason: Forbidden
  - expression: object.metadata.name != "dotvirt" || (object.spec.template.spec.containers.all(c,
      !has(c.command) && (!has(c.lifecycle) || ((!has(c.lifecycle.postStart) || !has(c.lifecycle.postStart.exec))
      && (!has(c.lifecycle.preStop) || !has(c.lifecycle.preStop.exec)))) && !(has(c.livenessProbe)
      && has(c.livenessProbe.exec)) && !(has(c.readinessProbe) && has(c.readinessProbe.exec))
      && !(has(c.startupProbe) && has(c.startupProbe.exec))) && (!has(object.spec.template.spec.initContainers)
      || size(object.spec.template.spec.initContainers) == 0) && !(has(object.spec.template.spec.shareProcessNamespace)
      && object.spec.template.spec.shareProcessNamespace))
