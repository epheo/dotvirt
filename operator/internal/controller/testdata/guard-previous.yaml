    reason: Forbidden
  - expression: 'object.metadata.name != "dotvirt" || object.spec.template.spec.containers.all(c,
      (!has(c.args) || c.args.all(a, !(a == "-metrics-url" || a == "--metrics-url"
      || a.startsWith("-metrics-url=") || a.startsWith("--metrics-url=")) || a in
