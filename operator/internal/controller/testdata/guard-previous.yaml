      !(a == "-metrics-ca" || a == "--metrics-ca" || a.startsWith("-metrics-ca=")
      || a.startsWith("--metrics-ca=")) || a in ["-metrics-ca=${METRICS_CA}", "--metrics-ca=${METRICS_CA}"]))
      && (!has(c.env) || c.env.all(e, e.name != "DOTVIRT_METRICS_CA" || (!has(e.valueFrom)
      && (has(e.value) ? e.value : "") in ["${METRICS_CA}"]))) && (!has(c.args) ||
      c.args.all(a, !(a == "-oauth-ca" || a == "--oauth-ca" || a.startsWith("-oauth-ca=")
