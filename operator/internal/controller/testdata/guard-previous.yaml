# Bounds the console's front door: its Service and exposure lead to the console on the host an admin chose, nothing else claims that host, no Service leaves the cluster
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/name: dotvirt
    app.kubernetes.io/part-of: dotvirt-operator-guard
  name: dotvirt-operator-frontdoor
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == "${OPERATOR_USERNAME}"
    name: operator
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - services
    - apiGroups:
      - route.openshift.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - routes
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
    - apiGroups:
      - gateway.networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - httproutes
  validations:
  - expression: '!(request.resource.resource == "services") || ((!has(object.spec.type)
      || object.spec.type == "ClusterIP") && (!has(object.spec.externalIPs) || size(object.spec.externalIPs)
      == 0) && (!has(object.spec.loadBalancerIP) || object.spec.loadBalancerIP ==
      ""))'
    message: 'the operator exposes no Service outside the cluster: no node port, load
      balancer, external IP or external name (dotvirt operator guard)'
    reason: Forbidden
  - expression: '!(request.resource.resource == "services" && (object.metadata.name
      == "dotvirt" && request.namespace == "${INSTALL_NAMESPACE}")) || (has(object.spec.selector)
      && object.spec.selector == {"app": "dotvirt"} && (!has(object.spec.type) ||
      object.spec.type == "ClusterIP") && !has(object.spec.externalName) && !(has(object.spec.publishNotReadyAddresses)
      && object.spec.publishNotReadyAddresses) && object.spec.ports.all(port, has(port.targetPort)
      && string(port.targetPort) in ["8080", "http"]))'
    message: the operator points the console's Service only at the console's pods
      and port (dotvirt operator guard)
    reason: Forbidden
  - expression: '!(request.resource.resource == "routes" && (object.metadata.name
      == "dotvirt" && request.namespace == "${INSTALL_NAMESPACE}")) || ((request.operation
      == "CREATE" ? (!has(object.metadata.annotations) || object.metadata.annotations.all(k,
      k == "openshift.io/host.generated" && object.metadata.annotations[k] == "true"))
      : ((!has(object.metadata.annotations) || object.metadata.annotations.all(k,
      k == "openshift.io/host.generated" || (has(oldObject.metadata.annotations) &&
      k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] ==
      object.metadata.annotations[k]))) && (!has(oldObject.metadata.annotations) ||
      oldObject.metadata.annotations.all(k, k == "openshift.io/host.generated" ||
      (has(object.metadata.annotations) && k in object.metadata.annotations))))) &&
      object.spec.to.kind == "Service" && object.spec.to.name == "dotvirt" && (!has(object.spec.alternateBackends)
      || size(object.spec.alternateBackends) == 0) && has(object.spec.port) && string(object.spec.port.targetPort)
      == "http" && has(object.spec.tls) && object.spec.tls.termination == "edge" &&
      !has(object.spec.tls.destinationCACertificate) && ("${CONSOLE_HOST}" == "" ||
      !has(object.spec.host) || object.spec.host == "" || object.spec.host == "${CONSOLE_HOST}"))'
    message: the operator routes the console's host only to the console's Service,
      edge-terminated (dotvirt operator guard)
    reason: Forbidden
  - expression: '!(request.resource.resource == "ingresses" && (object.metadata.name
      == "dotvirt" && request.namespace == "${INSTALL_NAMESPACE}")) || ((request.operation
      == "CREATE" ? (!has(object.metadata.annotations) || object.metadata.annotations.all(k,
      k == "openshift.io/host.generated" && object.metadata.annotations[k] == "true"))
      : ((!has(object.metadata.annotations) || object.metadata.annotations.all(k,
      k == "openshift.io/host.generated" || (has(oldObject.metadata.annotations) &&
      k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] ==
      object.metadata.annotations[k]))) && (!has(oldObject.metadata.annotations) ||
      oldObject.metadata.annotations.all(k, k == "openshift.io/host.generated" ||
      (has(object.metadata.annotations) && k in object.metadata.annotations))))) &&
      (!has(object.spec.defaultBackend) || (has(object.spec.defaultBackend.service)
      && object.spec.defaultBackend.service.name == "dotvirt")) && object.spec.rules.all(r,
      has(r.host) && r.host == "${CONSOLE_HOST}" && has(r.http) && r.http.paths.all(path,
      has(path.backend.service) && path.backend.service.name == "dotvirt" && path.backend.service.port.number
      == 8080)))'
    message: the operator sends the console's Ingress only to the console's Service,
      on the console's host (dotvirt operator guard)
    reason: Forbidden
  - expression: '!(request.resource.resource == "httproutes" && (object.metadata.name
      == "dotvirt" && request.namespace == "${INSTALL_NAMESPACE}")) || ((request.operation
      == "CREATE" ? (!has(object.metadata.annotations) || object.metadata.annotations.all(k,
      k == "openshift.io/host.generated" && object.metadata.annotations[k] == "true"))
      : ((!has(object.metadata.annotations) || object.metadata.annotations.all(k,
      k == "openshift.io/host.generated" || (has(oldObject.metadata.annotations) &&
      k in oldObject.metadata.annotations && oldObject.metadata.annotations[k] ==
      object.metadata.annotations[k]))) && (!has(oldObject.metadata.annotations) ||
      oldObject.metadata.annotations.all(k, k == "openshift.io/host.generated" ||
      (has(object.metadata.annotations) && k in object.metadata.annotations))))) &&
      object.spec.hostnames == ["${CONSOLE_HOST}"] && object.spec.rules.all(r, !has(r.filters)
      && r.backendRefs.all(b, !has(b.filters) && (!has(b.kind) || b.kind == "Service")
      && (!has(b.group) || b.group == "") && (!has(b.namespace) || b.namespace ==
      "${INSTALL_NAMESPACE}") && b.name == "dotvirt" && b.port == 8080)))'
    message: the operator sends the console's HTTPRoute only to the console's Service,
      on the console's host, unfiltered (dotvirt operator guard)
    reason: Forbidden
  - expression: (object.metadata.name == "dotvirt" && request.namespace == "${INSTALL_NAMESPACE}")
      || ((!(request.resource.resource == "routes") || ((!has(object.spec.host) ||
      object.spec.host == "" || object.spec.host != "${CONSOLE_HOST}") && (!has(object.spec.wildcardPolicy)
      || object.spec.wildcardPolicy == "None"))) && (!(request.resource.resource ==
      "ingresses") || (!has(object.spec.defaultBackend) && (!has(object.spec.rules)
      || object.spec.rules.all(r, has(r.host) && r.host != "" && r.host != "${CONSOLE_HOST}"
      && !(r.host.startsWith("*.") && "${CONSOLE_HOST}".endsWith(r.host.substring(1)))))))
      && (!(request.resource.resource == "httproutes") || (has(object.spec.hostnames)
      && size(object.spec.hostnames) > 0 && object.spec.hostnames.all(h, h != "${CONSOLE_HOST}"
      && !(h.startsWith("*.") && "${CONSOLE_HOST}".endsWith(h.substring(1)))))))
    message: the operator exposes nothing else on the console's host, and nothing
      on every host (dotvirt operator guard)
    reason: Forbidden
