      && (!has(object.spec.template.spec.initContainers) || object.spec.template.spec.initContainers.all(c,
      (has(c.securityContext) && has(c.securityContext.runAsNonRoot)) ? c.securityContext.runAsNonRoot
      : (has(object.spec.template.spec.securityContext) && has(object.spec.template.spec.securityContext.runAsNonRoot)
      && object.spec.template.spec.securityContext.runAsNonRoot))))'
    message: the operator runs every container as non-root (dotvirt operator guard)
    reason: Forbidden
  - expression: '(object.spec.template.spec.containers.all(c, (has(c.securityContext)
      && has(c.securityContext.seccompProfile)) ? c.securityContext.seccompProfile.type
      in ["RuntimeDefault", "Localhost"] : (has(object.spec.template.spec.securityContext)
      && has(object.spec.template.spec.securityContext.seccompProfile) && object.spec.template.spec.securityContext.seccompProfile.type
      in ["RuntimeDefault", "Localhost"])) && (!has(object.spec.template.spec.initContainers)
      || object.spec.template.spec.initContainers.all(c, (has(c.securityContext) &&
      has(c.securityContext.seccompProfile)) ? c.securityContext.seccompProfile.type
      in ["RuntimeDefault", "Localhost"] : (has(object.spec.template.spec.securityContext)
      && has(object.spec.template.spec.securityContext.seccompProfile) && object.spec.template.spec.securityContext.seccompProfile.type
      in ["RuntimeDefault", "Localhost"]))))'
    message: the operator runs every container with a RuntimeDefault or Localhost
      seccomp profile (dotvirt operator guard)
    reason: Forbidden
---
# Bounds the operator's RBAC bindings: only the ones it renders, to their own roles and rendered subjects
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/name: dotvirt
    app.kubernetes.io/part-of: dotvirt-operator-guard
  name: dotvirt-operator-bindings
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == "${OPERATOR_USERNAME}"
    name: operator
  matchConstraints:
    resourceRules:
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - clusterrolebindings
    - apiGroups:
      - rbac.authorization.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - rolebindings
  validations:
  - expression: 'request.resource.resource == "clusterrolebindings" ? object.metadata.name
      in ["dotvirt", "dotvirt-argocd-apply", "dotvirt-argocd-read", "dotvirt-platform-network-admin",
      "dotvirt-platform-sync", "dotvirt-storage-catalog"] : (object.metadata.name
      in ["dotvirt-sync-request"] && request.namespace == "${ARGO_NAMESPACE}")'
    message: the operator writes only the bindings it renders, by name (dotvirt operator
      guard)
    reason: Forbidden
  - expression: object.roleRef.apiGroup == "rbac.authorization.k8s.io" && object.roleRef.kind
      == "ClusterRole" && object.roleRef.name == object.metadata.name
    message: the operator binds each binding to the ClusterRole of its own name (dotvirt
      operator guard)
    reason: Forbidden
  - expression: '!has(object.subjects) || object.subjects.all(s, (s.kind + "/" + (has(s.namespace)
      ? s.namespace : "") + "/" + s.name) in {"dotvirt": ["ServiceAccount/${INSTALL_NAMESPACE}/dotvirt"],
      "dotvirt-argocd-apply": ["ServiceAccount/${ARGO_NAMESPACE}/${ARGO_CONTROLLER}",
      "ServiceAccount/${ARGO_NAMESPACE}/dotvirt-platform-sync"], "dotvirt-argocd-read":
      ["ServiceAccount/${ARGO_NAMESPACE}/${ARGO_CONTROLLER}"], "dotvirt-platform-network-admin":
      ["Group//dotvirt-platform-admins"], "dotvirt-platform-sync": ["ServiceAccount/${ARGO_NAMESPACE}/dotvirt-platform-sync"],
      "dotvirt-storage-catalog": ["Group//system:authenticated"], "dotvirt-sync-request":
      ["ServiceAccount/${INSTALL_NAMESPACE}/dotvirt"]}[object.metadata.name])'
    message: the operator binds each binding to its rendered subjects only (dotvirt
      operator guard)
    reason: Forbidden
---
# Bounds the operator's writes to its install: its finalizers only, never the spec an admin wrote
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/name: dotvirt
    app.kubernetes.io/part-of: dotvirt-operator-guard
  name: dotvirt-operator-install
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == "${OPERATOR_USERNAME}"
    name: operator
  matchConstraints:
    resourceRules:
    - apiGroups:
      - dotvirt.io
      apiVersions:
      - v1alpha1
      operations:
      - UPDATE
      resources:
      - dotvirts
  validations:
  - expression: has(object.spec) == has(oldObject.spec) && (!has(object.spec) || object.spec
      == oldObject.spec)
    message: the operator may change only its install's finalizers, never its spec
      (dotvirt operator guard)
    reason: Forbidden
  - expression: has(object.metadata.labels) == has(oldObject.metadata.labels) && (!has(object.metadata.labels)
      || object.metadata.labels == oldObject.metadata.labels)
    message: the operator may change only its install's finalizers, never its labels
      (dotvirt operator guard)
    reason: Forbidden
  - expression: has(object.metadata.annotations) == has(oldObject.metadata.annotations)
      && (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations)
    message: the operator may change only its install's finalizers, never its annotations
      (dotvirt operator guard)
    reason: Forbidden
  - expression: has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences)
      && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences
      == oldObject.metadata.ownerReferences)
    message: the operator may change only its install's finalizers, never its owners
      (dotvirt operator guard)
    reason: Forbidden
---
# Bounds the console's front door: its Service and exposure lead to the console on the host an admin chose
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  labels:
    app.kubernetes.io/name: dotvirt
    app.kubernetes.io/part-of: dotvirt-operator-guard
  name: dotvirt-operator-frontdoor
spec:
  failurePolicy: Fail
  matchConditions:
  - expression: request.userInfo.username == "${OPERATOR_USERNAME}"
    name: operator
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - services
    - apiGroups:
      - route.openshift.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - routes
    - apiGroups:
      - networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ingresses
    - apiGroups:
      - gateway.networking.k8s.io
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - httproutes
  validations:
  - expression: '!(request.resource.resource == "services" && (object.metadata.name
      == "dotvirt" && request.namespace == "${INSTALL_NAMESPACE}")) || (has(object.spec.selector)
      && object.spec.selector == {"app": "dotvirt"} && (!has(object.spec.type) ||
      object.spec.type == "ClusterIP") && !has(object.spec.externalName) && !(has(object.spec.publishNotReadyAddresses)
      && object.spec.publishNotReadyAddresses) && object.spec.ports.all(port, has(port.targetPort)
      && string(port.targetPort) in ["8080", "http"]))'
    message: the operator points the console's Service only at the console's pods
      and port (dotvirt operator guard)
    reason: Forbidden
  - expression: '!(request.resource.resource == "routes" && (object.metadata.name
      == "dotvirt" && request.namespace == "${INSTALL_NAMESPACE}")) || ((request.operation
      == "CREATE" ? !has(object.metadata.annotations) : has(object.metadata.annotations)
      == has(oldObject.metadata.annotations) && (!has(object.metadata.annotations)
      || object.metadata.annotations == oldObject.metadata.annotations)) && object.spec.to.kind
      == "Service" && object.spec.to.name == "dotvirt" && (!has(object.spec.alternateBackends)
      || size(object.spec.alternateBackends) == 0) && has(object.spec.port) && string(object.spec.port.targetPort)
      == "http" && has(object.spec.tls) && object.spec.tls.termination == "edge" &&
      !has(object.spec.tls.destinationCACertificate) && (!has(object.spec.host) ||
      object.spec.host == "" || object.spec.host == "${CONSOLE_HOST}"))'
    message: the operator routes the console's host only to the console's Service,
      edge-terminated (dotvirt operator guard)
    reason: Forbidden
  - expression: '!(request.resource.resource == "ingresses" && (object.metadata.name
      == "dotvirt" && request.namespace == "${INSTALL_NAMESPACE}")) || ((request.operation
      == "CREATE" ? !has(object.metadata.annotations) : has(object.metadata.annotations)
      == has(oldObject.metadata.annotations) && (!has(object.metadata.annotations)
      || object.metadata.annotations == oldObject.metadata.annotations)) && (!has(object.spec.defaultBackend)
      || (has(object.spec.defaultBackend.service) && object.spec.defaultBackend.service.name
      == "dotvirt")) && object.spec.rules.all(r, has(r.host) && r.host == "${CONSOLE_HOST}"
      && has(r.http) && r.http.paths.all(path, has(path.backend.service) && path.backend.service.name
      == "dotvirt" && path.backend.service.port.number == 8080)))'
    message: the operator sends the console's Ingress only to the console's Service,
      on the console's host (dotvirt operator guard)
    reason: Forbidden
  - expression: '!(request.resource.resource == "httproutes" && (object.metadata.name
      == "dotvirt" && request.namespace == "${INSTALL_NAMESPACE}")) || ((request.operation
      == "CREATE" ? !has(object.metadata.annotations) : has(object.metadata.annotations)
      == has(oldObject.metadata.annotations) && (!has(object.metadata.annotations)
      || object.metadata.annotations == oldObject.metadata.annotations)) && object.spec.hostnames
      == ["${CONSOLE_HOST}"] && object.spec.rules.all(r, !has(r.filters) && r.backendRefs.all(b,
      !has(b.filters) && (!has(b.kind) || b.kind == "Service") && (!has(b.group) ||
      b.group == "") && (!has(b.namespace) || b.namespace == "${INSTALL_NAMESPACE}")
      && b.name == "dotvirt" && b.port == 8080)))'
    message: the operator sends the console's HTTPRoute only to the console's Service,
      on the console's host, unfiltered (dotvirt operator guard)
    reason: Forbidden
  - expression: (object.metadata.name == "dotvirt" && request.namespace == "${INSTALL_NAMESPACE}")
      || "${CONSOLE_HOST}" == "" || ((!(request.resource.resource == "routes") ||
      ((!has(object.spec.host) || object.spec.host != "${CONSOLE_HOST}") && (!has(object.spec.wildcardPolicy)
      || object.spec.wildcardPolicy == "None"))) && (!(request.resource.resource ==
      "ingresses") || !has(object.spec.rules) || object.spec.rules.all(r, !has(r.host)
      || r.host != "${CONSOLE_HOST}")) && (!(request.resource.resource == "httproutes")
      || !has(object.spec.hostnames) || !("${CONSOLE_HOST}" in object.spec.hostnames)))
    message: the operator exposes nothing else on the console's host (dotvirt operator
      guard)
    reason: Forbidden
---
