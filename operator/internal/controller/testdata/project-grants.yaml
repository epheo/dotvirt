apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    dotvirt.io/project: x-project
  name: x-ns-egress
  namespace: x-ns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dotvirt-tenant-egress
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: x-project-owner
- kind: ServiceAccount
  name: dotvirt-p-x-project
  namespace: argocd
