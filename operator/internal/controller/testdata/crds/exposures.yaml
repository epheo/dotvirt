# Route and HTTPRoute, the kinds the console may be exposed by, typed for the
# fields the operator guard's rules read as these kinds' own schemas type
# them, so the rules have something to judge and type-check as on a cluster
# serving them. Every object stays open to the fields not listed.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.route.openshift.io
spec:
  group: route.openshift.io
  names: {kind: Route, listKind: RouteList, plural: routes, singular: route}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                host: {type: string}
                path: {type: string}
                wildcardPolicy: {type: string}
                to:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties: {kind: {type: string}, name: {type: string}, weight: {type: integer}}
                alternateBackends:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties: {kind: {type: string}, name: {type: string}, weight: {type: integer}}
                port:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties: {targetPort: {x-kubernetes-int-or-string: true}}
                tls:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    termination: {type: string}
                    destinationCACertificate: {type: string}
                    insecureEdgeTerminationPolicy: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: httproutes.gateway.networking.k8s.io
  annotations:
    # The apiserver asks this of any CRD in a Kubernetes-owned group.
    api-approved.kubernetes.io: unapproved, test stub
spec:
  group: gateway.networking.k8s.io
  names: {kind: HTTPRoute, listKind: HTTPRouteList, plural: httproutes, singular: httproute}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                hostnames: {type: array, items: {type: string}}
                parentRefs: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                rules:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      filters: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                      matches: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
                      backendRefs:
                        type: array
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          properties:
                            group: {type: string}
                            kind: {type: string}
                            namespace: {type: string}
                            name: {type: string}
                            port: {type: integer}
                            weight: {type: integer}
                            filters: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
