apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  labels:
    app.kubernetes.io/name: dotvirt
    app.kubernetes.io/part-of: dotvirt-operator-guard
  name: dotvirt-operator-bindings
spec:
  policyName: dotvirt-operator-bindings
  validationActions:
  - Deny
