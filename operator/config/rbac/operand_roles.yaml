# Operand ClusterRoles — shipped as STATIC manifests (created + owned by OLM from the
# bundle, or by `kustomize build config/default` for a non-OLM install), NOT authored
# by the operator at runtime. Shipping them statically is what lets the operator drop
# `escalate` and all ClusterRole writes: at reconcile it only creates the matching
# ClusterRoleBindings (see internal/install/rbac.go), which needs just `bind` on these
# named roles. Keep the names in sync with the roleRefs in rbac.go.
---
# dotvirt's runtime ServiceAccount read RBAC (TokenReview, namespace/VM reads, Argo app
# patch for re-sync, wizard catalogs, network read). Read-only — Argo owns the apply path.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dotvirt
  labels:
    app.kubernetes.io/name: dotvirt
    app.kubernetes.io/managed-by: dotvirt-operator
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Whether routes are on: a GatewayClass exists.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses"]
    verbs: ["list"]
  # The front door, read in memory and filtered per caller. The experimental
  # route kinds and portail's rate limits may not be served.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "tlsroutes", "tcproutes", "udproutes"]
    verbs: ["list", "watch"]
  - apiGroups: ["portail.epheo.eu"]
    resources: ["ratelimitpolicies"]
    verbs: ["list", "watch"]
  # r-drbd's cluster-scoped objects, read in memory and filtered per caller,
  # and the PersistentVolumes that say which claim each Volume serves.
  - apiGroups: ["r-drbd.io"]
    resources: ["volumes", "pools", "nodedisks"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["list", "watch"]
  # Watched (never read) to learn when a token's namespace visibility may have
  # changed, so the per-token visible-set cache is invalidated promptly.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["list", "watch"]
  # The rest of what a token's authorization derives from, watched the same way.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterrolebindings", "clusterroles"]
    verbs: ["list", "watch"]
  - apiGroups: ["user.openshift.io"]
    resources: ["groups"]
    verbs: ["list", "watch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["instancetype.kubevirt.io"]
    resources: ["virtualmachineclusterinstancetypes", "virtualmachineclusterpreferences"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datasources"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch"]
  # The Storage section's fact sheet: class facts, CDI's resolved claim
  # settings, snapshot support, and the CSI driver's published free capacity.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csistoragecapacities"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["storageprofiles"]
    verbs: ["get", "list", "watch"]
  # Read once at startup: the upload proxy URL browsers stream images to.
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["cdiconfigs"]
    verbs: ["get"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.ovn.org"]
    resources: ["userdefinednetworks", "clusteruserdefinednetworks", "egressfirewalls", "egressips", "adminpolicybasedexternalroutes"]
    verbs: ["get", "list", "watch"]
  # The policy plane behind the Security view (netstate reflectors).
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy.networking.k8s.io"]
    resources: ["adminnetworkpolicies", "baselineadminnetworkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["nmstate.io"]
    resources: ["nodenetworkstates", "nodenetworkconfigurationpolicies", "nodenetworkconfigurationenactments"]
    verbs: ["get", "list", "watch"]
  # Watched for the DRS panel's live descheduler status.
  - apiGroups: ["operator.openshift.io"]
    resources: ["kubedeschedulers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # The cluster's pod and service networks, which the connectivity trace
  # places addresses against.
  - apiGroups: ["config.openshift.io"]
    resources: ["networks"]
    resourceNames: ["cluster"]
    verbs: ["get"]
---
# The apply rights for the kinds dotvirt's PR flow emits, granted to the SHARED Argo
# application-controller SA (the binding targets it). The AppProjects — not this role —
# scope which app may use the cluster-scoped kinds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dotvirt-argocd-apply
  labels:
    app.kubernetes.io/name: dotvirt
    app.kubernetes.io/managed-by: dotvirt-operator
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["k8s.ovn.org"]
    resources: ["userdefinednetworks", "clusteruserdefinednetworks", "egressfirewalls", "egressips", "adminpolicybasedexternalroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy.networking.k8s.io"]
    resources: ["adminnetworkpolicies", "baselineadminnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["nmstate.io"]
    resources: ["nodenetworkconfigurationpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Tenant access delegation: the platform repo's owners -> namespace-admin RoleBindings,
  # scoped to the platform tier by the dotvirt-platform AppProject.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # DRS: the descheduler operator install + config, and the PSI MachineConfig its
  # load-aware profile needs — all committed to the platform repo, applied by Argo.
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "operatorgroups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["operator.openshift.io"]
    resources: ["kubedeschedulers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# The authoring SIGNAL the UI's SSAR-gate reads (create cudn/nncp/namespaces), and list,
# so a delegate is shown what they author. The user never creates these: Argo applies
# them from the platform repo, so it's decoupled from the apply path. Bind it to delegate
# platform-network authoring to non-admins (cluster-admins satisfy it implicitly).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dotvirt-platform-network-admin
  labels:
    app.kubernetes.io/name: dotvirt
    app.kubernetes.io/managed-by: dotvirt-operator
rules:
  - apiGroups: ["k8s.ovn.org"]
    resources: ["clusteruserdefinednetworks", "egressips", "adminpolicybasedexternalroutes"]
    verbs: ["create", "list"]
  - apiGroups: ["policy.networking.k8s.io"]
    resources: ["adminnetworkpolicies", "baselineadminnetworkpolicies"]
    verbs: ["create", "list"]
  - apiGroups: ["nmstate.io"]
    resources: ["nodenetworkconfigurationpolicies"]
    verbs: ["create", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  # DRS authoring: the panel's SSAR gates (kubedeschedulers always; machineconfigs
  # only for the PSI opt-in).
  - apiGroups: ["operator.openshift.io"]
    resources: ["kubedeschedulers"]
    verbs: ["create", "list"]
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigs"]
    verbs: ["create"]
  # Shared template library curation: the save-to-library SSAR gate. Rule-based,
  # so it works while the template.kubevirt.io CRD is absent from the cluster.
  - apiGroups: ["template.kubevirt.io"]
    resources: ["virtualmachinetemplates"]
    verbs: ["create"]
---
# EgressFirewall writes: a tenant kind the built-in admin role lacks. The platform
# repo binds it, per project namespace, to the subjects of that namespace's admin
# grant, the owners and the project's Argo sync account alike (<ns>-egress): the
# project's people may stage the egress firewall its repo may sync, and no more.
# The operator never binds it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dotvirt-tenant-egress
  labels:
    app.kubernetes.io/name: dotvirt
    app.kubernetes.io/managed-by: dotvirt-operator
rules:
  - apiGroups: ["k8s.ovn.org"]
    resources: ["egressfirewalls"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# What the platform tier's Argo sync account needs beyond dotvirt-argocd-apply once
# Argo syncs the platform repo as it: the Namespaces that repo declares, and `bind` on
# the roles its project grants name, which is what lets it apply those RoleBindings
# without holding every right they grant (no escalate, no other role).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dotvirt-platform-sync
  labels:
    app.kubernetes.io/name: dotvirt
    app.kubernetes.io/managed-by: dotvirt-operator
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["admin", "dotvirt-tenant-egress"]
    verbs: ["bind"]
