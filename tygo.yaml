# Generates web/src/lib/model.gen.ts from internal/model — the type source
# api.ts star re-exports (its overlays only narrow unions or fix null-vs-
# undefined). CI regenerates and diffs, so a model.go change always surfaces
# a visible TS diff in review. Regenerate with `make types`.
packages:
  - path: "github.com/epheo/dotvirt/internal/model"
    output_path: "web/src/lib/model.gen.ts"
    # kinds.go is Go-side wiring (the managed-kind table), not a wire type.
    exclude_files:
      - "kinds.go"
